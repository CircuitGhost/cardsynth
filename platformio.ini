[env:cardputer]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
lib_deps =
	m5stack/M5Cardputer@^1.1.1
	m5stack/M5Unified@^0.2.10
	m5stack/M5GFX@^0.2.10
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-DBOARD_HAS_PSRAM
board_build.f_cpu = 240000000L

